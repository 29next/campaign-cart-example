<div data-next-component="shipping-form" class="form-sections">
    <div class="form-section form-section--first">
        <h2 class="form-section__title">Step 2: Customer Information</h2>
        <div class="form-grid">
            <div data-next-component="shipping-field-row" class="form-grid__row">
                <div class="form-group">
                    <div class="form-input"><label for="shipping_fname" class="label-checkout">First
                            Name</label><input autocomplete="given-name" os-checkout-validate="required"
                            placeholder="First Name*" maxlength="256" name="shipping_fname"
                            data-name="Shipping First Name" type="text" id="shipping_fname"
                            data-next-checkout-field="fname" class="input-flds"></div>
                </div>
                <div class="form-group">
                    <div class="form-input"><label for="shipping_lname" class="label-checkout">Last
                            Name</label><input autocomplete="family-name" os-checkout-validate="required"
                            placeholder="Last Name*" maxlength="256" name="shipping_lname"
                            data-name="Shipping Lirst Name" type="text" id="shipping_lname"
                            data-next-checkout-field="lname" class="input-flds"></div>
                </div>
            </div>
            <div class="form-grid__row">
                <div class="form-group">
                    <div class="form-input"><label for="email" class="label-checkout">Email</label><input
                            autocomplete="email" os-checkout-validate="required" name="email" data-name="Email"
                            type="email" id="email" placeholder="Email*" data-next-checkout-field="email"
                            class="input-flds"></div>
                </div>
            </div>
            <div data-next-component="shipping-field-row" class="form-grid__row">
                <div class="form-group">
                    <div class="form-input"><label for="phone" class="label-checkout">Phone</label><input
                            autocomplete="tel-full" name="phone" data-name="Phone" type="tel" id="phone"
                            placeholder="201-555-0123" data-next-checkout-field="phone" class="input-flds">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div pb-checkout-section="shipping" class="form-section">
        <h1 class="form-section__title">Step 3: Shipping Information</h1>
        <div>
            <div class="form-grid">
                <div data-next-component="shipping-field-row" class="form-grid__row">
                    <div class="form-group">
                        <div class="form-input"><label for="shipping_country" class="label-checkout">Country</label>
                            <div class="select-form-wrapper"><select autocomplete="country-name"
                                    os-checkout-validate="required" data-next-checkout-field="country"
                                    class="input-flds select-field">
                                    <option value="">Select Country</option>
                                </select>
                                <div class="caret-down">
                                    <div class="select-arrow w-embed"><svg xmlns="http://www.w3.org/2000/svg"
                                            width="100%" height="100%" viewBox="0 0 14 14" fill="none"
                                            stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                            stroke-linejoin="round">
                                            <polyline points="2 4.75 7 9.25 12 4.75"></polyline>
                                        </svg></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div data-next-component="shipping-field-row" class="form-grid__row">
                    <div class="form-group">
                        <div class="form-input">
                            <div class="form-input-icon w-embed"><svg xmlns="http://www.w3.org/2000/svg" width="100%"
                                    height="100%" viewBox="0 0 14 14" focusable="false" aria-hidden="true"
                                    class="a8x1wuy a8x1wux *1fragem32 *1fragempz *1fragemly *1fragemlo _1fragemp6">
                                    <circle cx="6" cy="6" r="4" fill="none" stroke="currentColor" stroke-width="1">
                                    </circle>
                                    <path fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"
                                        stroke-linejoin="round" d="m9.25 9.25 2.5 2.5"></path>
                                </svg></div>
                            <label for="shipping_address1" class="label-checkout">Address</label><input
                                autocomplete="address-line1" os-checkout-validate="required" placeholder="Address*"
                                data-next-checkout-field="address1" class="input-flds">
                        </div>
                    </div>
                </div>
                <div data-next-component="shipping-field-row" class="form-grid__row">
                    <div class="form-group">
                        <div class="form-input"><label for="shipping_address2" class="label-checkout">Apartment,
                                suite, etc. (optional)</label><input autocomplete="address-line2"
                                name="shipping_address2" data-name="Shipping Address 2" type="text"
                                id="shipping_addres2" placeholder="Apartment, suite, etc. (optional)" maxlength="256"
                                data-next-checkout-field="address2" class="input-flds"></div>
                    </div>
                </div>
                <div data-next-component="location" class="next-hidden">
                    <div data-next-component="shipping-field-row" class="form-grid__row">
                        <div class="form-group">
                            <div class="form-input"><label for="shipping_city" class="label-checkout">City</label><input
                                    autocomplete="address-level2" os-checkout-validate="required" placeholder="City*"
                                    maxlength="256" name="shipping_city" data-name="Shipping City" type="text"
                                    id="shipping_city" pattern="^[A-Za-z\s]+$" data-next-checkout-field="city"
                                    class="input-flds">
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="form-input"><label for="shipping_province" class="label-checkout">State</label>
                                <div class="select-form-wrapper"><select autocomplete="address-level1"
                                        os-checkout-validate="required" name="shipping_province"
                                        data-name="Shipping Province" type="select" id="shipping_province"
                                        data-next-checkout-field="province" class="input-flds select-field">
                                        <option value="">Select State</option>
                                    </select>
                                    <div class="caret-down">
                                        <div class="select-arrow w-embed"><svg xmlns="http://www.w3.org/2000/svg"
                                                width="100%" height="100%" viewBox="0 0 14 14" fill="none"
                                                stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                                stroke-linejoin="round">
                                                <polyline points="2 4.75 7 9.25 12 4.75"></polyline>
                                            </svg></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="form-input"><label for="shipping_postal_code" class="label-checkout">ZIP
                                    Code</label><input autocomplete="postal-code" os-checkout-validate="required"
                                    placeholder="ZIP Code*" maxlength="10" name="shipping_postal_code"
                                    data-name="Shipping Postal Code" type="text" id="shipping_postal_code"
                                    inputmode="numeric" pattern="(^\d{5}$)|(^\d{5}-\d{4}$)"
                                    data-next-checkout-field="postal" class="input-flds"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
